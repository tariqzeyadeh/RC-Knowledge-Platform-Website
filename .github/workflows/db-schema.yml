name: Push database schema

on:
  push:
    branches: [main]
    paths:
      - "lib/db/schema.ts"
      - "drizzle.config.ts"
      - "scripts/push-schema-if-remote.ts"
  workflow_dispatch:

jobs:
  push-schema:
    name: Apply Drizzle schema to Turso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema
        run: npm run db:push:ci
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
